name = "ez-rma-assistant"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://danieloculus0-bot.github.io"
OPENAI_MODEL = "gpt-5.4-mini"

[secrets]
required = ["OPENAI_API_KEY", "WORKER_ACCESS_TOKEN"]

[[ratelimits]]
name = "ASSISTANT_RATE"
namespace_id = "7826241"
simple = { limit = 12, period = 60 }
