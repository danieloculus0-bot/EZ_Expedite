name: owner-escalation-tests
on:
  push:
  pull_request:
jobs:
  report:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute synthetic owner escalation acceptance tests
        run: python -m unittest discover -s tests -p 'test_owner_escalation.py' -v
