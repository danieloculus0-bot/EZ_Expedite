name: rma-readiness-acceptance
on:
  push:
  pull_request:
jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic RMA readiness acceptance
        run: python -m unittest discover -s tests -p 'test_rma_readiness_report.py' -v
